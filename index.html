<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관심종목 모멘텀</title>
<meta name="theme-color" content="#f1f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1218" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f1f3f7; --surface:#ffffff; --surface-2:#e9edf3; --line:#dde2ea;
  --text:#141923; --text-2:#4d586a; --text-3:#8491a3;
  --tr:#0b8a55; --br:#2f6fe0; --tl:#d4780f; --bl:#cc3b32;
  --tr-bg:#e1f3ea; --br-bg:#e2ecfc; --tl-bg:#fcecd8; --bl-bg:#fbe3e0;
  --sig:#7b3fd1; --dn:#b57600; --trail:#f26a0f; --dot:#7a849b;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1218; --surface:#161b24; --surface-2:#1f2631; --line:#262e3b;
    --text:#e9edf4; --text-2:#a2adbf; --text-3:#6f7b8e;
    --tr:#52c98f; --br:#6fa8ff; --tl:#f4a65c; --bl:#f27d74;
    --tr-bg:#15342a; --br-bg:#182a47; --tl-bg:#3a2a16; --bl-bg:#3c211f;
    --sig:#c4a2ff; --dn:#e9b13a; --dot:#8a93aa;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}

header{padding:calc(16px + env(safe-area-inset-top)) 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:13px;font-weight:600;color:var(--text-3);letter-spacing:0}
.asof{font-size:26px;font-weight:700;letter-spacing:-.8px;line-height:1.15;margin-top:2px}
.asof small{font-size:13px;font-weight:500;color:var(--text-3);letter-spacing:0;margin-left:6px}
.sub{color:var(--text-3);font-size:12px;margin-top:3px}
.refresh{flex:none;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:50%;display:grid;place-items:center;padding:0}
.refresh:active{background:var(--surface-2)}
.refresh svg{width:19px;height:19px}
.refresh[disabled] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.refresh[disabled] svg{animation:none}}
.stale{background:var(--tl-bg);color:var(--tl);border-radius:12px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}

/* 이번 주 변화 */
.brief{background:var(--surface);border-radius:18px;padding:14px 16px 16px;margin-bottom:6px}
.brief-row{display:grid;grid-template-columns:84px 1fr;column-gap:10px;align-items:baseline;padding:5px 0;font-size:14px}
.brief-row + .brief-row{border-top:1px solid var(--line)}
.brief-row .k{font-weight:700}
.brief-row.up .k{color:var(--sig)} .brief-row.dn .k{color:var(--dn)} .brief-row.turn .k{color:var(--bl)}
.brief-row .v{color:var(--text);display:flex;flex-wrap:wrap;gap:4px 12px}
.brief-row .v b{font-weight:700;cursor:pointer}
.brief-row .v small{font-size:11.5px;font-weight:500;color:var(--text-3);margin-left:4px}
.brief-row .none{color:var(--text-3)}
.brief-row .cap{grid-column:1/3;font-size:11.5px;color:var(--text-3);margin-top:1px}
.cap .q{font-style:normal;font-weight:600}
.cap .q.tr{color:var(--tr)} .cap .q.br{color:var(--br)} .cap .q.tl{color:var(--tl)} .cap .q.bl{color:var(--bl)}
.dist{display:flex;gap:3px;height:8px;margin-top:14px}
.dist i{display:block;border-radius:4px;min-width:6px}
.dist-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:7px}

/* 그룹과 종목 줄 */
.grp{display:flex;align-items:center;gap:8px;margin:22px 0 4px;padding:0 14px 0 4px;font-size:14px;font-weight:700}
.grp i{width:8px;height:8px;border-radius:50%}
.grp span{color:var(--text-3);font-weight:500}
/* 열 제목은 아래 숫자 칸(62px 두 칸, 사이 12px)과 같은 오른쪽 선에 맞춘다 */
.grp em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:500;color:var(--text-3);display:flex;gap:12px}
.grp em b{display:block;width:62px;text-align:right;font-weight:500}
.rows{background:var(--surface);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr 62px 62px;align-items:center;gap:0 12px;width:100%;padding:11px 14px 11px 12px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--text-2);outline-offset:-2px}
.gl{display:block;width:44px;height:44px}
.id{min-width:0}
.tk{font-weight:700;font-size:16px;letter-spacing:-.2px}
.nm{color:var(--text-3);font-size:12.5px;margin-left:6px;font-weight:500}
.mark{font-size:11px;margin-left:5px}
.mark.up{color:var(--sig)} .mark.dn{color:var(--dn)}
.st{font-size:12.5px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.bad{color:var(--bl)}
.n{text-align:right;font-size:16px;font-weight:600;letter-spacing:-.3px}
.pos{color:var(--tr)} .neg{color:var(--bl)}
.empty{text-align:center;color:var(--text-3);padding:36px 0}
.qchip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.qchip.tr{background:var(--tr-bg);color:var(--tr)} .qchip.br{background:var(--br-bg);color:var(--br)}
.qchip.tl{background:var(--tl-bg);color:var(--tl)} .qchip.bl{background:var(--bl-bg);color:var(--bl)}
.qchip.na{background:var(--surface-2);color:var(--text-3)}

.chartbox{background:var(--surface);border-radius:18px;padding:10px;margin-bottom:10px}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
svg text{font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);padding:4px 6px 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pt{cursor:pointer}

.sheet-bg{position:fixed;inset:0;background:rgba(5,8,12,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;z-index:21;max-width:560px;margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-bg{transition:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h2{margin:0 0 6px;font-size:20px;letter-spacing:-.4px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kv div{background:var(--surface-2);border-radius:14px;padding:10px 6px;text-align:center}
.kv small{display:block;font-size:11px;color:var(--text-3)}
.kv b{font-size:18px;letter-spacing:-.3px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th{color:var(--text-3);font-weight:500;text-align:right;padding:4px 0}
th:first-child,td:first-child{text-align:left}
td{padding:8px 0;border-top:1px solid var(--line);text-align:right}
.read{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:10px;font-size:14px}
.read h3{margin:0 0 8px;font-size:15px}
.read p{margin:6px 0;color:var(--text-2)}
.read ul{margin:6px 0;padding-left:0;list-style:none}
.read li{margin:8px 0;color:var(--text-2)}
.foot{color:var(--text-3);font-size:11.5px;text-align:center;margin:18px 0}

nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;color:var(--text-3);font:inherit;font-size:11.5px;padding:9px 0 8px;display:grid;justify-items:center;gap:3px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--text);font-weight:700}

/* 관심종목 편집 */
.wl-form{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px}
.wl-form input{min-width:0;font:inherit;font-size:15px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.wl-form input:focus{outline:2px solid var(--text-3);outline-offset:-1px}
.wl-form button,.wl-bar button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:12px;padding:0 16px;background:var(--text);color:var(--bg)}
.wl-form button:disabled,.wl-bar button:disabled{opacity:.5}
.wl-hint{font-size:12px;color:var(--text-3);margin:7px 2px 0}
.wl-hint.bad{color:var(--bl)}
.wl-row{display:grid;grid-template-columns:1fr 44px;align-items:center;padding:10px 6px 10px 16px;border-top:1px solid var(--line)}
.wl-row:first-child{border-top:0}
.wl-del{width:44px;height:44px;border:0;background:none;color:var(--text-3);display:grid;place-items:center;border-radius:12px}
.wl-del:active{background:var(--surface-2);color:var(--bl)}
.wl-del svg{width:20px;height:20px}
.st.wl-ok{color:var(--text-3)} .st.wl-warn{color:var(--tl)} .st.wl-wait{color:var(--br)}
.wl-conn{background:var(--surface);border-radius:18px;padding:14px 16px;margin-top:18px;font-size:13px;color:var(--text-2)}
.wl-conn summary{font-weight:700;color:var(--text);font-size:14px}
.wl-conn p{margin:10px 0 6px}
.wl-conn a{color:var(--br)}
.wl-link{display:block;margin-top:10px;font:inherit;font-size:12.5px;color:var(--text-3);background:none;border:0;padding:0;text-decoration:underline}
.wl-msg{border-radius:14px;padding:11px 14px;font-size:13px;margin-top:14px}
.wl-msg.ok{background:var(--tr-bg);color:var(--tr)} .wl-msg.bad{background:var(--bl-bg);color:var(--bl)}
.wl-bar{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom));margin-top:16px;background:var(--text);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.wl-bar span{margin-right:auto}
.wl-bar button{height:40px}
.wl-bar button#wl-undo{background:none;color:var(--bg);opacity:.75}
.wl-bar button#wl-save{background:var(--bg);color:var(--text)}

.cap b{color:var(--text);font-weight:800}

/* PC: 같은 화면을 넓은 창에서 보기 좋게 */
@media (min-width: 900px){
  .wrap{max-width:760px}
  body{padding-bottom:84px}
  nav{justify-content:center;gap:12px}
  nav button{flex:0 0 150px}
  .row{grid-template-columns:48px 1fr 84px 84px;padding:13px 20px 13px 16px}
  .gl{width:48px;height:48px}
  .grp em b{width:84px}
  .grp{padding-right:20px}
  .sheet{max-width:640px;border-radius:24px;bottom:24px;left:0;right:0}
}
.pcchart{
  --border:var(--line); --border-strong:var(--text-3); --grid:var(--line);
  --pos:var(--tr); --pos-strong:var(--tr); --neg:var(--bl); --neg-strong:var(--bl);
  --q-tr:var(--tr); --q-br:var(--br); --q-tl:var(--tl); --q-bl:var(--bl);
  --q-tr-soft:var(--tr-bg); --q-br-soft:var(--br-bg); --q-tl-soft:var(--tl-bg); --q-bl-soft:var(--bl-bg);
  --sig-ink:var(--sig); --dn-ink:var(--dn);
  --trail-ink:#b24705; --trail-soft:#fff1e4; --shadow:none;
  --font-mono:var(--font); --font-sans:var(--font);
}
@media (prefers-color-scheme: dark){ .pcchart{ --trail-ink:#ffb372; --trail-soft:#33200f; --trail:#ff8a2a; } }
.pcchart .qchip{display:inline-block}
.pcchart .chart-body{align-items:stretch}
.pcchart .chart-hint b{color:var(--text)}
.pcpanel{background:var(--surface);border-radius:18px;padding:18px;margin-bottom:10px}
@media (min-width: 900px){
  .pcpanel.pcchart .chart-body{grid-template-columns:minmax(0,1fr)}
  .pcpanel.pcchart .chart-side{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px 20px;align-items:start}
  .pcpanel.pcchart .chart-side > *{grid-column:2}
  .pcpanel.pcchart .chart-side .pick{grid-column:1;grid-row:1 / span 4;min-height:0}
}
@media (max-width: 899px){
  .pcpanel{padding:10px}
  .pcchart .chart-hint{display:none}
  .pcchart .chart-side{gap:10px}
  .pcchart .chart-side .pick{order:-1;min-height:0}
  .pcchart .chart-legend{flex-direction:row;flex-wrap:wrap;gap:6px 14px}
  .pcchart .lg-quads{display:none}
  .pcchart .pick .pick-sub{display:none}
}
.pcchart .chart-body{display:grid;
    grid-template-columns:minmax(0,1fr) 310px;
    gap:20px;
    align-items:start;}
@media (max-width:1000px){
.pcchart .chart-body{grid-template-columns:minmax(0,1fr);}
}
.pcchart .chart-side{display:flex;flex-direction:column;gap:12px;min-width:0;word-break:keep-all;overflow-wrap:break-word;}
.pcchart .chart-wrap{position:relative;}
.pcchart .chart-svg{display:block;width:100%;height:auto;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:pan-y;}
.pcchart .chart-svg.panning{cursor:grabbing;}
.pcchart .chart-tools{position:absolute;top:6px;right:8px;display:flex;gap:6px;z-index:2;}
.pcchart .chart-tools button{font:600 12px var(--font-mono);
    min-width:30px;height:28px;padding:0 9px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text-2);
    border-radius:7px;
    cursor:pointer;}
.pcchart .chart-tools button:hover{background:var(--surface-2);color:var(--text);}
.pcchart .chart-tools button:focus-visible{outline:2px solid var(--trail);outline-offset:1px;}
.pcchart .zoom-tag{position:absolute;top:8px;left:58px;z-index:2;
    font:600 11px var(--font-mono);
    color:var(--trail-ink);background:var(--trail-soft);
    border:1px solid var(--trail);border-radius:99px;
    padding:2px 10px;display:none;}
.pcchart .chart-wrap.zoomed .zoom-tag{display:block;}
.pcchart .chart-caption{font-size:12px;
    color:var(--text-3);
    font-family:var(--font-mono);
    line-height:1.55;
    margin:0;}
.pcchart .chart-hint{font-size:11.5px;color:var(--text-2);font-family:var(--font-mono);line-height:1.6;margin:0;}
.pcchart .chart-hint b{color:var(--text);font-weight:600;}
.pcchart .axis-label{fill:var(--text-3);font-family:var(--font-mono);font-size:11px;}
.pcchart .axis-line{stroke:var(--border-strong);stroke-width:1.2;}
.pcchart .grid-line{stroke:var(--grid);stroke-width:1;}
.pcchart .plot-border{fill:none;stroke:var(--border);stroke-width:1;}
.pcchart .quad-label{font-family:var(--font-sans);font-size:13px;font-weight:600;}
.pcchart .quad-label.q-tr{fill:var(--q-tr);}
.pcchart .quad-label.q-br{fill:var(--q-br);}
.pcchart .quad-label.q-tl{fill:var(--q-tl);}
.pcchart .quad-label.q-bl{fill:var(--q-bl);}
.pcchart .zoombox{fill:var(--trail);fill-opacity:.12;stroke:var(--trail);stroke-width:1.2;stroke-dasharray:4 3;pointer-events:none;}
.pcchart .pt{stroke:var(--surface);stroke-width:1.8;fill:var(--dot);}
.pcchart .pt.up{fill:var(--sig);stroke-width:2;}
.pcchart .pt.dn{fill:var(--dn);stroke-width:2;}
.pcchart .sig-ring{fill:none;stroke-width:1.5;opacity:.55;}
.pcchart .sig-ring.up{stroke:var(--sig);}
.pcchart .sig-ring.dn{stroke:var(--dn);}
.pcchart .pt-label{font-family:var(--font-sans);font-size:12px;font-weight:600;fill:var(--text);}
.pcchart .pt-g.up .pt-label{fill:var(--sig-ink);font-weight:700;}
.pcchart .pt-g.dn .pt-label{fill:var(--dn-ink);font-weight:700;}
.pcchart .leader{stroke:var(--text-3);stroke-width:1;opacity:.5;}
.pcchart .pt-g{cursor:pointer;transition:opacity .15s;outline:none;}
.pcchart .pt-g:focus-visible .pt{stroke:var(--text);stroke-width:2.5;}
.pcchart .has-sel .pt-g:not(.sel){opacity:.2;}
.pcchart .pt-g.sel .pt, .pcchart .pt-g.sel .sig-ring{opacity:0;}
.pcchart .pt-g.sel .pt-label{fill:var(--trail-ink);font-weight:700;font-size:13px;paint-order:stroke;stroke:var(--surface);stroke-width:3px;}
.pcchart .hl .trail-path{fill:none;stroke:var(--trail);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
.pcchart .hl .trail-dot{fill:var(--trail);stroke:var(--surface);stroke-width:1.2;}
.pcchart .hl .trail-glow{fill:var(--trail);opacity:.2;}
.pcchart .hl .trail-now{fill:var(--trail);stroke:var(--surface);stroke-width:2;}
.pcchart .hl .trail-lab{font-family:var(--font-mono);font-size:10.5px;font-weight:600;fill:var(--trail-ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;}
@media (prefers-reduced-motion: reduce){
.pcchart .pt-g{transition:none;}
}
.pcchart .chart-legend{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:12px;color:var(--text-2);font-family:var(--font-mono);}
.pcchart .chart-legend span{display:inline-flex;align-items:center;gap:8px;line-height:1.4;}
.pcchart .lg-dot{width:10px;height:10px;border-radius:50%;background:var(--dot);display:inline-block;flex:none;}
.pcchart .lg-dot.up{background:var(--sig);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--sig);margin-inline:2px;}
.pcchart .lg-dia{width:9px;height:9px;background:var(--dn);transform:rotate(45deg);display:inline-block;flex:none;margin-inline:2px;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--dn);}
.pcchart .lg-line{width:18px;height:2px;border-radius:2px;background:var(--trail);display:inline-block;flex:none;}
.pcchart .pick{border:1px dashed var(--border-strong);
    border-radius:10px;
    padding:12px 14px;
    min-height:150px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:7px;
    font-size:13px;
    color:var(--text-2);
    line-height:1.5;}
.pcchart .pick.on{border:1px solid var(--trail);
    background:var(--trail-soft);
    justify-content:flex-start;}
.pcchart .pick-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pcchart .pick-head strong{font-size:15px;color:var(--text);}
.pcchart .pick-tk{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--trail-ink);}
.pcchart .pick-sec{color:var(--text-3);font-size:12px;}
.pcchart .pick-vals{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--font-mono);font-size:12.5px;color:var(--text-2);}
.pcchart .pick-vals b{font-weight:600;}
.pcchart .pick-vals b.pos, .pcchart .pick-sub b.pos{color:var(--pos-strong);}
.pcchart .pick-vals b.neg, .pcchart .pick-sub b.neg{color:var(--neg-strong);}
.pcchart .pick-path{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--text-2);}
.pcchart .pick-sub{font-family:var(--font-mono);font-size:11.5px;color:var(--text-3);}
.pcchart .pick-sig{font-size:12.5px;font-weight:600;}
.pcchart .pick-sig.up{color:var(--sig-ink);}
.pcchart .pick-sig.dn{color:var(--dn-ink);}
.pcchart .qchip{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;}
.pcchart .qchip.sm{font-size:11px;padding:1px 8px;}
.pcchart .qchip.q-tr, .pcchart .pace-tag.q-tr{background:var(--q-tr-soft);color:var(--q-tr);}
.pcchart .qchip.q-br, .pcchart .pace-tag.q-br{background:var(--q-br-soft);color:var(--q-br);}
.pcchart .qchip.q-tl, .pcchart .pace-tag.q-tl{background:var(--q-tl-soft);color:var(--q-tl);}
.pcchart .qchip.q-bl, .pcchart .pace-tag.q-bl{background:var(--q-bl-soft);color:var(--q-bl);}
.pcchart .pace-tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:99px;white-space:nowrap;margin-top:3px;}
.pcchart .pick-read{font-size:12.5px;color:var(--text);font-weight:500;}
.pcchart .lg-quads{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;}
.pcchart .lg-quads .qchip{text-align:center;}
.pcchart .muted{color:var(--text-3);}

@media (min-width: 900px){ .wrap.wide{max-width:1180px} }

</head>
<body>
<div class="wrap">
  <header>
    <div><h1>관심종목 모멘텀</h1><div class="asof" id="asof">&nbsp;</div><div class="sub" id="upd"></div></div>
    <button class="refresh" id="refresh" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </header>
  <div id="stale"></div>
  <main id="main"></main>
  <p class="foot">배당 미반영 종가 기준 · 투자 참고용이며 투자 권유가 아닙니다.</p>
</div>

<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>

<nav>
  <button data-tab="list" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-6 4 3 7-9"/><path d="M4 21h16"/></svg>모멘텀</button>
  <button data-tab="chart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><circle cx="17" cy="7" r="2"/><circle cx="7" cy="16" r="2"/></svg>차트</button>
  <button data-tab="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>관심종목</button>
  <button data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>읽는 법</button>
</nav>

<script>
const QN = {tr:'상승 지속', br:'상승 전환', tl:'하락 전환', bl:'하락 지속'};
const QSHORT = {tr:'상승', br:'반등', tl:'조정', bl:'하락'};
const ARROW = {acc:'↗', flat:'→', dec:'↘'};
const SNAP = ['3주 전','2주 전','1주 전','현재'];
const $ = id => document.getElementById(id);
const fp = v => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(1) + '%';
const fpp = v => (v > 0 ? '+' : '') + v.toFixed(1) + '%p';
const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
const quadOf = (x, y) => (y >= 0 ? 't' : 'b') + (x >= 0 ? 'r' : 'l');

let D = null, tab = 'list', filter = 'all', sortKey = 'pace';
try { tab = localStorage.getItem('tab') || 'list'; filter = localStorage.getItem('filter') || 'all'; sortKey = localStorage.getItem('sort') || 'pace'; } catch (e) {}
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* ---------- 데이터 ---------- */
async function load() {
  $('refresh').disabled = true;
  try {
    const r = await fetch('data.json?_=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
    try { localStorage.setItem('data', JSON.stringify(D)); } catch (e) {}
    $('stale').innerHTML = '';
  } catch (e) {
    let c = null; try { c = JSON.parse(localStorage.getItem('data')); } catch (e2) {}
    if (c) { D = c; $('stale').innerHTML = '<div class="stale">네트워크에 연결할 수 없어 마지막으로 저장된 데이터를 보여줍니다.</div>'; }
    else { $('main').innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.<br>연결을 확인한 뒤 새로고침하세요.</div>'; }
  }
  $('refresh').disabled = false;
  if (D) {
    $('asof').innerHTML = `${+D.asof.slice(5, 7)}월 ${+D.asof.slice(8)}일<small>종가 기준</small>`; $('upd').textContent = `갱신 ${D.updated}`;
    // 평일마다 갱신되므로 기준일이 5일 넘게 지났다면 자동 갱신이 멈춘 것이다 (주말·미국 휴장 연휴는 5일 안쪽)
    const age = Math.floor((Date.now() - Date.parse(D.asof + 'T00:00:00Z')) / 86400000);
    if (age > 5) $('stale').innerHTML += `<div class="stale">⚠ 데이터가 ${age}일 전 종가 기준입니다. 자동 갱신이 멈췄을 수 있습니다. GitHub 저장소의 Actions 탭을 확인하세요.</div>`;
    render();
  }
}

/* ---------- 목록 ---------- */
const GROUPS = ['tr', 'br', 'tl', 'bl'];      // 좋은 쪽에서 나쁜 쪽으로

function stateText(it) {
  if (it.turn) return `🔻 ${it.turn}`;
  if (it.state) return `${ARROW[it.state_key]} ${it.state}`;
  return '';
}

/* 3주 궤적을 한 칸짜리 사분면에 그린 작은 그림: 현재 사분면이 옅게 칠해지고, 점은 지금 위치 */
function glyph(it) {
  const S = 44, c = S / 2, pts = it.h;
  const m = Math.max(2, ...pts.flat().map(Math.abs)) * 1.15;
  const X = v => c + v / m * (c - 5), Y = v => c - v / m * (c - 5);
  const tp = pts.map(p => [+X(p[0]).toFixed(1), +Y(p[1]).toFixed(1)]);
  const q = {tr: [c, 0], tl: [0, 0], br: [c, c], bl: [0, c]}[it.quad];
  const last = tp[3];
  return `<svg class="gl" viewBox="0 0 ${S} ${S}" aria-hidden="true">
    <clipPath id="g-${it.t.replace(/\W/g, '')}"><rect width="${S}" height="${S}" rx="12"/></clipPath>
    <rect width="${S}" height="${S}" rx="12" fill="var(--surface-2)"/>
    <rect x="${q[0]}" y="${q[1]}" width="${c}" height="${c}" fill="var(--${it.quad})" opacity=".2" clip-path="url(#g-${it.t.replace(/\W/g, '')})"/>
    <path d="M${c} 3V${S - 3}M3 ${c}H${S - 3}" stroke="var(--line)" stroke-width="1"/>
    <path d="${smooth(tp)}" fill="none" stroke="var(--trail)" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.4" fill="var(--${it.quad})" stroke="var(--surface)" stroke-width="1.2"/></svg>`;
}

function row(it) {
  const mark = it.sig === 'up' ? '<span class="mark up">▲</span>' : it.sig === 'dn' ? '<span class="mark dn">▼</span>' : '';
  if (!it.h) return `<button class="row" data-t="${it.t}"><svg class="gl" viewBox="0 0 44 44"><rect width="44" height="44" rx="12" fill="var(--surface-2)"/></svg>
    <div class="id"><span class="tk">${it.t}</span><span class="nm">${it.n}</span><div class="st">상장 3개월 미만</div></div>
    <span class="n ${cls(it.x1m)}">${fp(it.x1m)}</span><span class="n" style="color:var(--text-3)">—</span></button>`;
  const flow = it.prev && it.prev !== it.quad ? `${QSHORT[it.prev]}→${QSHORT[it.quad]}` : '';
  const st = stateText(it) || flow;      // 이동 경로는 왼쪽 그림이 보여주므로, 상승·하락 지속 줄에는 상태만 쓴다
  return `<button class="row" data-t="${it.t}">${glyph(it)}
    <div class="id"><span class="tk">${it.t}</span><span class="nm">${it.n}</span>${mark}<div class="st ${it.turn ? 'bad' : ''}">${st || '&nbsp;'}</div></div>
    <span class="n ${cls(it.x1)}">${fp(it.x1)}</span><span class="n ${cls(it.x3)}">${fp(it.x3)}</span></button>`;
}

function renderList() {
  const all = D.items, plotted = all.filter(i => i.h), short = all.filter(i => !i.h);
  const by = q => plotted.filter(i => i.quad === q).sort((a, b) => b.pace - a.pace);
  const ups = plotted.filter(i => i.sig === 'up'), dns = plotted.filter(i => i.sig === 'dn'), turns = plotted.filter(i => i.turn);
  const chips = (a, tag) => a.length ? a.map(i => `<span><b data-t="${i.t}">${i.t}</b>${tag ? `<small>${i.turn}</small>` : ''}</span>`).join('') : '<span class="none">없음</span>';
  const q = k => `<em class="q ${k}">${QN[k]}</em>`;
  const n = k => by(k).length;
  // 신호 이름(상승 진입·하락 진입·꺾임)은 그대로 두고, 아래 그룹 이름과 같은 말로 풀어 쓴다
  let html = `<section class="brief" aria-label="이번 주 변화">
    <div class="brief-row up"><span class="k">▲ 상승 진입</span><span class="v">${chips(ups)}</span><div class="cap"><b>3주</b> 안에 ${q('br')} → 지금 ${q('tr')}</div></div>
    <div class="brief-row dn"><span class="k">▼ 하락 진입</span><span class="v">${chips(dns)}</span><div class="cap"><b>3주</b> 안에 ${q('tl')} → 지금 ${q('bl')}</div></div>
    <div class="brief-row turn"><span class="k">🔻 꺾임</span><span class="v">${chips(turns, true)}</span><div class="cap">지난주 ${q('br')}·${q('tr')} → 이번 주 ${q('bl')}</div></div>
    <div class="dist" role="img" aria-label="사분면별 종목 수">${GROUPS.filter(q => n(q)).map(q => `<i style="flex:${n(q)};background:var(--${q})"></i>`).join('')}</div>
    <div class="dist-cap"><span>상승 쪽 ${n('tr') + n('br')}</span><span>하락 쪽 ${n('tl') + n('bl')}</span></div></section>`;
  GROUPS.forEach(q => {
    const g = by(q); if (!g.length) return;
    html += `<h2 class="grp"><i style="background:var(--${q})"></i>${QN[q]} <span>${g.length}</span><em><b>1개월</b><b>3개월</b></em></h2><div class="rows">${g.map(row).join('')}</div>`;
  });
  if (short.length) html += `<h2 class="grp"><i style="background:var(--text-3)"></i>상장 3개월 미만 <span>${short.length}</span></h2><div class="rows">${short.map(row).join('')}</div>`;
  $('main').innerHTML = html;
  document.querySelectorAll('.row, .brief-row b').forEach(c => c.onclick = () => openSheet(c.dataset.t));
}

const PCChart = (function(){
const $ = id => document.getElementById(id);
const QUAD = {
  tr:{t:'상승 지속', cls:'q-tr'}, tl:{t:'하락 전환', cls:'q-tl'},
  br:{t:'상승 전환', cls:'q-br'}, bl:{t:'하락 지속', cls:'q-bl'}
};
const BAND = 0.5;     // 속도 변화가 ±BAND(%p) 안이면 '속도 유지'
const paceOf = (x, y) => +(x - y / 3).toFixed(2);          // 속도 변화 = 1M − 3M÷3
// 1주 전에 상승 쪽(상승 전환·상승 지속)이었다가 지금 하락 지속으로 내려온 종목: 속도 변화(낙폭 둔화 등)보다 이 표시를 우선한다
const TURN = {'br>bl':'반등 꺾임', 'tr>bl':'상승 꺾임'};
const SNAP_LABELS = ['3주 전','2주 전','1주 전','현재'];
const EMPTY_PICK = '<span>점을 누르면(마우스는 올리면) 그 종목의 <b>3주 전 → 2주 전 → 1주 전 → 현재</b> 이동 궤적이 주황색으로 표시되고 다른 점은 흐려집니다.</span>';
const SIG_TEXT = {up:'▲ 상승 진입', dn:'▼ 하락 진입'};

const quadOf = (x, y) => (y >= 0 ? 't' : 'b') + (x >= 0 ? 'r' : 'l');

// 사분면 + 속도 변화 → 세부 상태. 상승 지속·하락 지속에서만 속도 변화를 구분한다
function stateOf(x, y){
  const q = quadOf(x, y), pace = paceOf(x, y);
  const k = pace >= BAND ? 'acc' : pace <= -BAND ? 'dec' : 'flat';
  const arrow = {acc:'↗', flat:'→', dec:'↘'}[k];
  if(q === 'tr') return {q, k, pace, arrow, name:{acc:'상승 가속', flat:'상승 유지', dec:'상승 둔화'}[k],
    read:{acc:'상승이 가속 중 — 최근 1개월이 3개월 평균 월 속도보다 빠릅니다.', flat:'상승 속도가 3개월 평균과 비슷합니다.', dec:'아직 오르는 중이지만 최근 1개월 속도가 3개월 평균 월 속도보다 느립니다.'}[k]};
  if(q === 'bl') return {q, k, pace, arrow, name:{acc:'낙폭 둔화', flat:'하락 유지', dec:'낙폭 확대'}[k],
    read:{acc:'아직 하락 중이지만 하락 속도가 완만해졌습니다(회복 조짐). 상승 모멘텀은 아닙니다.', flat:'하락 속도가 3개월 평균과 비슷합니다.', dec:'하락 속도가 3개월 평균보다 빨라졌습니다.'}[k]};
  if(q === 'br') return {q, k, pace, arrow:'', name:'상승 전환', read:'하락하던 흐름이 최근 1개월 반등으로 바뀐 구간입니다. 3개월까지 +가 되면 상승 지속.'};
  return {q, k, pace, arrow:'', name:'하락 전환', read:'오르던 흐름이 최근 1개월 꺾인 조정 구간입니다. 3개월까지 −가 되면 하락 지속.'};
}

// 신호: 최근 3주 안에 '전환' 구간을 거쳐 현재 '지속' 구간에 있는 종목
//  up = 상승 전환(br) → 상승 지속(tr)   |   dn = 하락 전환(tl) → 하락 지속(bl)
const hasEarly = (p, q) => p.h.slice(0, 3).some(([x, y]) => quadOf(x, y) === q);
const sigOf = p => {
  const now = quadOf(p.h[3][0], p.h[3][1]);
  if(now === 'tr' && hasEarly(p, 'br')) return 'up';
  if(now === 'bl' && hasEarly(p, 'tl')) return 'dn';
  return '';
};

function fmtPp(v){
  if(Math.abs(v) < 0.05) return '0.0%p';
  return (v > 0 ? '+' : '') + v.toFixed(1) + '%p';
}
function fmtPct(v){
  if(Math.abs(v) < 0.05) return '0.0%';
  return (v > 0 ? '+' : '') + v.toFixed(1) + '%';
}
function tickStep(range){
  return range <= 2.5 ? 0.5 : range <= 6 ? 1 : range <= 12 ? 2 : range <= 30 ? 5 : range <= 70 ? 10 : 20;
}
function fmtTick(t){
  const v = Math.abs(t) < 1e-9 ? 0 : t;
  return (v > 0 ? '+' : '') + (Number.isInteger(v) ? v : v.toFixed(1)) + '%';
}
// Catmull-Rom → cubic Bézier: 4개 시점을 부드럽게 잇는 곡선
function smoothPath(pts){
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1 = [p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6];
    const c2 = [p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

/* ---------- 차트 범위 ---------- */
function fullDomain(list){
  const xs = [], ys = [];
  list.forEach(p => p.h.forEach(([x, y]) => { xs.push(x); ys.push(y); }));  // 4개 시점 모두 포함
  const xMin = Math.min(...xs), xMax = Math.max(...xs), yMin = Math.min(...ys), yMax = Math.max(...ys);
  const xs_ = tickStep(xMax - xMin), ys_ = tickStep(yMax - yMin);
  let x0 = Math.floor((xMin - (xMax - xMin) * 0.08) / xs_) * xs_;
  let x1 = Math.ceil((xMax + (xMax - xMin) * 0.08) / xs_) * xs_;
  let y0 = Math.floor((yMin - (yMax - yMin) * 0.08) / ys_) * ys_;
  let y1 = Math.ceil((yMax + (yMax - yMin) * 0.08) / ys_) * ys_;
  if(x0 > -xs_) x0 = -xs_;
  if(y0 > -ys_) y0 = -ys_;
  if(x1 < xs_) x1 = xs_;
  if(y1 < ys_) y1 = ys_;
  return {x0, x1, y0, y1};
}

/* ---------- scatter: 한 번의 그리기 ---------- */
function paint(svg, list, dom, W, H, uid){
  const M = {left:54, right:30, top:34, bottom:46};
  const plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;
  const {x0, x1, y0, y1} = dom;
  const sx = v => M.left + (v - x0) / (x1 - x0) * plotW;
  const sy = v => M.top + plotH - (v - y0) / (y1 - y0) * plotH;
  const xStep = tickStep(x1 - x0), yStep = tickStep(y1 - y0);
  const ticks = (min, max, step) => {
    const out = [];
    for(let t = Math.ceil(min / step - 1e-9) * step; t <= max + 1e-9; t += step) out.push(Math.round(t * 1000) / 1000);
    return out;
  };

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let s = `<defs><clipPath id="cp-${uid}"><rect x="${M.left}" y="${M.top}" width="${plotW}" height="${plotH}"/></clipPath></defs>`;
  ticks(x0, x1, xStep).forEach(t => {
    const x = sx(t);
    s += `<line class="grid-line" x1="${x}" y1="${M.top}" x2="${x}" y2="${M.top+plotH}"/>`;
    s += `<text class="axis-label" x="${x}" y="${M.top+plotH+17}" text-anchor="middle">${fmtTick(t)}</text>`;
  });
  ticks(y0, y1, yStep).forEach(t => {
    const y = sy(t);
    s += `<line class="grid-line" x1="${M.left}" y1="${y}" x2="${M.left+plotW}" y2="${y}"/>`;
    s += `<text class="axis-label" x="${M.left-8}" y="${y+3.8}" text-anchor="end">${fmtTick(t)}</text>`;
  });
  if(x0 < 0 && x1 > 0) s += `<line class="axis-line" x1="${sx(0)}" y1="${M.top}" x2="${sx(0)}" y2="${M.top+plotH}"/>`;
  if(y0 < 0 && y1 > 0) s += `<line class="axis-line" x1="${M.left}" y1="${sy(0)}" x2="${M.left+plotW}" y2="${sy(0)}"/>`;
  s += `<rect class="plot-border" x="${M.left}" y="${M.top}" width="${plotW}" height="${plotH}"/>`;

  // 사분면 이름: 해당 사분면이 현재 화면에 걸쳐 있을 때만, 화면 모서리에 표시
  const padIn = 9;
  if(x1 > 0 && y1 > 0) s += `<text class="quad-label ${QUAD.tr.cls}" x="${M.left+plotW-padIn}" y="${M.top+17}" text-anchor="end">${QUAD.tr.t}</text>`;
  if(x0 < 0 && y1 > 0) s += `<text class="quad-label ${QUAD.tl.cls}" x="${M.left+padIn}" y="${M.top+17}" text-anchor="start">${QUAD.tl.t}</text>`;
  if(x1 > 0 && y0 < 0) s += `<text class="quad-label ${QUAD.br.cls}" x="${M.left+plotW-padIn}" y="${M.top+plotH-9}" text-anchor="end">${QUAD.br.t}</text>`;
  if(x0 < 0 && y0 < 0) s += `<text class="quad-label ${QUAD.bl.cls}" x="${M.left+padIn}" y="${M.top+plotH-9}" text-anchor="start">${QUAD.bl.t}</text>`;
  s += `<text class="axis-label" x="${M.left+plotW}" y="${H-7}" text-anchor="end">1개월 수익률 →</text>`;
  s += `<text class="axis-label" x="${M.left+2}" y="${M.top-13}" text-anchor="start">↑ 3개월 수익률</text>`;

  // 화면 안에 있는 점만 그림 + 라벨끼리 겹치지 않게 배치
  const visible = list.filter(p => p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1);
  const placed = [], labelBoxes = {};
  const cand = [
    [9,-9,'start'],[9,15,'start'],[-9,-9,'end'],[-9,15,'end'],
    [0,-15,'middle'],[0,22,'middle'],[15,4,'start'],[-15,4,'end'],
    [20,-18,'start'],[-20,-18,'end'],[20,24,'start'],[-20,24,'end']
  ];
  const overlaps = (bx, arr) => arr.some(o => !(bx.x2 < o.x1 || bx.x1 > o.x2 || bx.y2 < o.y1 || bx.y1 > o.y2));
  const boxFor = (lx, ly, anchor, w) =>
    anchor === 'start' ? {x1:lx, x2:lx+w, y1:ly-10, y2:ly+3}
    : anchor === 'end' ? {x1:lx-w, x2:lx, y1:ly-10, y2:ly+3}
    : {x1:lx-w/2, x2:lx+w/2, y1:ly-10, y2:ly+3};
  const inPlot = bx => bx.x1 >= M.left && bx.x2 <= M.left+plotW && bx.y1 >= M.top && bx.y2 <= M.top+plotH+14;

  s += `<g clip-path="url(#cp-${uid})">`;
  visible.forEach(p => {
    const px = sx(p.x), py = sy(p.y);
    const textW = Math.max(p.t.length * 7.4, 24) + 2;
    let chosen = null;
    for(const [dx, dy, anchor] of cand){
      const lx = px + dx, ly = py + dy;
      const bx = boxFor(lx, ly, anchor, textW);
      if(inPlot(bx) && !overlaps(bx, placed)){ chosen = {lx, ly, anchor, bx}; break; }
    }
    if(!chosen){
      const [dx, dy, anchor] = cand[0];
      chosen = {lx: px + dx, ly: py + dy, anchor, bx: boxFor(px + dx, py + dy, anchor, textW)};
    }
    placed.push(chosen.bx);
    labelBoxes[p.t] = chosen.bx;

    const r = p.sig ? 6.4 : 5.2;
    s += `<g class="pt-g${p.sig ? ' ' + p.sig : ''}" data-t="${p.t}" tabindex="0" role="button" ` +
         `aria-label="${p.t} ${p.n}, 1개월 ${fmtPct(p.x)}, 3개월 ${fmtPct(p.y)}${p.sig ? ', ' + SIG_TEXT[p.sig] + ' 신호' : ''}">` +
         `<circle cx="${px}" cy="${py}" r="16" fill="transparent"/>`;
    if(p.sig) s += `<circle class="sig-ring ${p.sig}" cx="${px}" cy="${py}" r="10.5"/>`;
    if(p.sig === 'dn'){
      const d = r * 1.25;
      s += `<path class="pt dn" d="M${px},${py-d} L${px+d},${py} L${px},${py+d} L${px-d},${py} Z"/>`;
    } else {
      s += `<circle class="pt${p.sig ? ' ' + p.sig : ''}" cx="${px}" cy="${py}" r="${r}"/>`;
    }
    if(Math.hypot(chosen.lx - px, chosen.ly - py) > 14){
      s += `<line class="leader" x1="${px}" y1="${py}" x2="${chosen.lx}" y2="${chosen.ly}"/>`;
    }
    s += `<text class="pt-label" x="${chosen.lx}" y="${chosen.ly}" text-anchor="${chosen.anchor}">${p.t}</text></g>`;
  });
  s += `</g><g class="hl" pointer-events="none" clip-path="url(#cp-${uid})"></g>`;
  svg.innerHTML = s;

  const hl = svg.querySelector('.hl');
  const byT = Object.fromEntries(list.map(p => [p.t, p]));
  // 선택한 종목의 3주 궤적을 주황색으로 그리기
  function highlight(t){
    if(!t){ hl.innerHTML = ''; return; }
    const p = byT[t];
    const pts = p.h.map(([x, y]) => [sx(x), sy(y)]);
    let h = `<path class="trail-path" d="${smoothPath(pts)}"/>`;
    pts.forEach(([x, y], i) => {
      if(i < 3) h += `<circle class="trail-dot" cx="${x}" cy="${y}" r="${(3.4 + i * 0.8).toFixed(1)}" style="opacity:${(0.5 + i * 0.15).toFixed(2)}"/>`;
    });
    const [nx, ny] = pts[3];
    h += `<circle class="trail-glow" cx="${nx}" cy="${ny}" r="14"/><circle class="trail-now" cx="${nx}" cy="${ny}" r="7"/>`;

    const occupied = [];
    if(labelBoxes[t]) occupied.push(labelBoxes[t]);
    pts.forEach(([x, y], i) => { const r = i === 3 ? 11 : 7; occupied.push({x1:x-r, x2:x+r, y1:y-r, y2:y+r}); });
    const lc = [[0,18,'middle'],[0,-11,'middle'],[11,4,'start'],[-11,4,'end'],[12,19,'start'],[-12,19,'end'],[12,-11,'start'],[-12,-11,'end']];
    [3, 2, 1, 0].forEach(i => {
      const [x, y] = pts[i];
      const w = SNAP_LABELS[i].length * 10 + 4;
      let pick = null;
      for(const [dx, dy, anchor] of lc){
        const bx = boxFor(x + dx, y + dy, anchor, w);
        if(inPlot(bx) && !overlaps(bx, occupied)){ pick = {lx:x+dx, ly:y+dy, anchor, bx}; break; }
      }
      if(!pick){ const [dx, dy, anchor] = lc[0]; pick = {lx:x+dx, ly:y+dy, anchor, bx: boxFor(x+dx, y+dy, anchor, w)}; }
      occupied.push(pick.bx);
      h += `<text class="trail-lab" x="${pick.lx}" y="${pick.ly}" text-anchor="${pick.anchor}">${SNAP_LABELS[i]}</text>`;
    });
    hl.innerHTML = h;
  }
  return {sx, sy, M, plotW, plotH, visible: visible.length, highlight};
}

/* ---------- board: 표 + 차트 + 상세 카드 + 확대·축소를 하나로 묶음 ---------- */
function makeBoard({list: all, chartId, pickId, legendId}){
  all.forEach(p => {
    if(!p.h){ p.na = true; p.x = p.x1m; p.y = null; p.c = null; p.sig = ''; return; }   // 상장 3개월 미만
    p.x = p.h[3][0]; p.y = p.h[3][1]; p.c = +(p.x - p.y).toFixed(2); p.sig = sigOf(p);
    p.pace = paceOf(p.x, p.y); p.st = stateOf(p.x, p.y);
    p.turn = TURN[quadOf(p.h[2][0], p.h[2][1]) + '>' + p.st.q] || null;
  });
  const list = all.filter(p => !p.na), naList = all.filter(p => p.na);
  const byT = Object.fromEntries(list.map(p => [p.t, p]));

  const host = $(chartId), pick = $(pickId);
  host.innerHTML =
    `<div class="chart-wrap"><svg class="chart-svg" role="group" aria-label="1개월·3개월 수익률 사분면 차트"></svg>` +
    `<div class="zoom-tag"></div>` +
    `<div class="chart-tools"><button type="button" data-act="in" aria-label="확대" title="확대">＋</button>` +
    `<button type="button" data-act="out" aria-label="축소" title="축소">－</button>` +
    `<button type="button" data-act="reset" title="전체 보기">초기화</button></div></div>`;
  const wrap = host.firstChild, svg = wrap.querySelector('svg'), tag = wrap.querySelector('.zoom-tag');
  const tools = wrap.querySelector('.chart-tools');

  const nUp = list.filter(p => p.sig === 'up').length, nDn = list.filter(p => p.sig === 'dn').length;
  $(legendId).innerHTML =
    `<span class="lg-quads"><span class="qchip sm q-tl">하락 전환</span><span class="qchip sm q-tr">상승 지속</span><span class="qchip sm q-bl">하락 지속</span><span class="qchip sm q-br">상승 전환</span></span>` +
    `<span><i class="lg-dot"></i>일반</span>` +
    `<span><i class="lg-dot up"></i>▲ 상승 진입 · ${nUp}개</span>` +
    `<span><i class="lg-dia"></i>▼ 하락 진입 · ${nDn}개</span>` +
    `<span><i class="lg-line"></i>선택 시 최근 3주 궤적</span>` +
    (naList.length ? `<span class="muted">차트 제외: ${naList.map(p => p.t).join('·')} (상장 3개월 미만)</span>` : '');

  const FULL = fullDomain(list);
  let dom = {...FULL}, W = 640, H = 420, ctx = null;
  let hover = null, pin = null, drag = null, justDragged = false;

  const isFull = () => ['x0','x1','y0','y1'].every(k => Math.abs(dom[k] - FULL[k]) < 1e-6);
  function size(){
    W = Math.max(300, Math.round(host.clientWidth || 640));
    H = W < 520 ? Math.round(W * 1.05) : Math.round(Math.min(W * 0.6, 680));
  }

  /* --- 상세 카드 --- */
  const chip = (k, sm) => `<span class="qchip ${QUAD[k].cls}${sm ? ' sm' : ''}">${QUAD[k].t}</span>`;
  const sgn = v => v >= 0 ? 'pos' : 'neg';
  function cardHtml(p){
    const qs = p.h.map(([x, y]) => quadOf(x, y));
    const [x0_, y0_] = p.h[0];
    let note = '';
    if(p.sig){
      const from = p.sig === 'up' ? 'br' : 'tl', to = p.sig === 'up' ? 'tr' : 'bl';
      const when = SNAP_LABELS.filter((_, i) => i < 3 && qs[i] === from).join('·');
      note = `<div class="pick-sig ${p.sig}">${SIG_TEXT[p.sig]} · ${when}에 ${QUAD[from].t} 구간이었다가 현재 ${QUAD[to].t}에 진입 — ` +
             `${p.sig === 'up' ? '오르기 시작했을 가능성, 주의 깊게 관찰' : '내리기 시작했을 가능성, 주의 깊게 관찰'}</div>`;
    }
    return `<div class="pick-head">${chip(qs[3])}<strong>${p.n}</strong><span class="pick-tk">${p.t}</span><span class="pick-sec">${p.s}</span></div>` +
      `<div class="pick-vals"><span>1개월 <b class="${sgn(p.x)}">${fmtPct(p.x)}</b></span>` +
      `<span>3개월 <b class="${sgn(p.y)}">${fmtPct(p.y)}</b></span>` +
      `<span>Δ <b class="${sgn(p.c)}">${fmtPct(p.c)}</b></span>` +
      `<span>속도 변화 <b class="${sgn(p.pace)}">${fmtPp(p.pace)}</b></span></div>` +
      (p.turn
        ? `<div class="pick-read"><span class="pace-tag q-bl" style="margin:0 6px 0 0">🔻 ${p.turn}</span>1주 전에는 ${QUAD[qs[2]].t} 구간이었는데 이번 주 하락 지속으로 내려왔습니다. ` +
          `속도 변화(${fmtPp(p.pace)}, ${p.st.name})는 3개월 평균 한 달치보다 덜 빠지고 있다는 뜻일 뿐, 상승이 이어지고 있다는 뜻은 아닙니다.</div>`
        : `<div class="pick-read"><span class="pace-tag q-${p.st.q}" style="margin:0 6px 0 0">${p.st.arrow ? p.st.arrow + ' ' : ''}${p.st.name}</span>${p.st.read}</div>`) +
      `<div class="pick-sub">3개월 월평균 ${fmtPct(+(p.y / 3).toFixed(2))} vs 최근 1개월 ${fmtPct(p.x)}</div>` +
      `<div class="pick-path"><span class="muted">3주 전</span>${chip(qs[0], true)}<span class="muted">→</span><span class="muted">현재</span>${chip(qs[3], true)}` +
      (qs[0] === qs[3] ? '<span class="muted">사분면 유지</span>' : '') + `</div>` +
      `<div class="pick-sub">1개월 ${fmtPct(x0_)} → <b class="${sgn(p.x)}">${fmtPct(p.x)}</b> · 3개월 ${fmtPct(y0_)} → <b class="${sgn(p.y)}">${fmtPct(p.y)}</b></div>` + note;
  }

  function apply(){
    const t = hover || pin;
    svg.classList.toggle('has-sel', !!t);
    svg.querySelectorAll('.pt-g').forEach(g => g.classList.toggle('sel', g.dataset.t === t));
    if(ctx) ctx.highlight(t);
    pick.classList.toggle('on', !!t);
    pick.innerHTML = t ? cardHtml(byT[t]) : EMPTY_PICK;
  }
  function draw(){
    ctx = paint(svg, list, dom, W, H, chartId);
    const zoomed = !isFull();
    wrap.classList.toggle('zoomed', zoomed);
    if(zoomed) tag.textContent = `확대 중 · ${ctx.visible}/${list.length}개 표시`;
    apply();
  }
  const togglePin = t => { pin = (pin === t) ? null : t; apply(); };

  /* --- 표 행 / 점 선택 (이벤트 위임: 다시 그려도 유지) --- */
  svg.addEventListener('pointerover', e => {
    if(e.pointerType !== 'mouse' || drag) return;
    const g = e.target.closest('.pt-g');
    if(g && g.dataset.t !== hover){ hover = g.dataset.t; apply(); }
  });
  svg.addEventListener('pointerout', e => {
    if(e.pointerType !== 'mouse' || drag) return;
    const g = e.target.closest('.pt-g');
    if(!g) return;
    const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('.pt-g') : null;
    if(to !== g){ hover = to ? to.dataset.t : null; apply(); }
  });
  svg.addEventListener('focusin', e => { const g = e.target.closest('.pt-g'); if(g){ hover = g.dataset.t; apply(); } });
  svg.addEventListener('focusout', e => {
    const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('.pt-g') : null;
    if(!to && hover){ hover = null; apply(); }
  });
  svg.addEventListener('click', e => {
    if(justDragged) return;
    const g = e.target.closest('.pt-g');
    if(g) togglePin(g.dataset.t); else { pin = null; apply(); }
  });
  svg.addEventListener('keydown', e => {
    const g = e.target.closest('.pt-g');
    if(g && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); togglePin(g.dataset.t); }
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && (pin || !isFull())){ pin = null; apply(); } });

  /* --- 확대·축소 --- */
  const svgPt = e => {
    const r = svg.getBoundingClientRect();
    return {x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height)};
  };
  const inPlotPt = p => ctx && p.x >= ctx.M.left && p.x <= ctx.M.left + ctx.plotW && p.y >= ctx.M.top && p.y <= ctx.M.top + ctx.plotH;
  const toData = p => ({
    x: dom.x0 + (p.x - ctx.M.left) / ctx.plotW * (dom.x1 - dom.x0),
    y: dom.y1 - (p.y - ctx.M.top) / ctx.plotH * (dom.y1 - dom.y0)
  });
  const MIN_RANGE = 0.4;
  function zoomBy(f, cx, cy){
    const mx = cx ?? (dom.x0 + dom.x1) / 2, my = cy ?? (dom.y0 + dom.y1) / 2;
    let n = {x0: mx - (mx - dom.x0) * f, x1: mx + (dom.x1 - mx) * f, y0: my - (my - dom.y0) * f, y1: my + (dom.y1 - my) * f};
    if(n.x1 - n.x0 >= FULL.x1 - FULL.x0){ n.x0 = FULL.x0; n.x1 = FULL.x1; }
    if(n.y1 - n.y0 >= FULL.y1 - FULL.y0){ n.y0 = FULL.y0; n.y1 = FULL.y1; }
    if(n.x1 - n.x0 < MIN_RANGE || n.y1 - n.y0 < MIN_RANGE) return;
    dom = n; draw();
  }
  tools.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.act === 'reset'){ dom = {...FULL}; draw(); }
    else zoomBy(b.dataset.act === 'in' ? 0.6 : 1 / 0.6);
  });
  svg.addEventListener('dblclick', () => { dom = {...FULL}; draw(); });
  svg.addEventListener('wheel', e => {
    if(!(e.ctrlKey || e.metaKey)) return;       // 일반 스크롤은 그대로 페이지 스크롤
    const p = svgPt(e); if(!inPlotPt(p)) return;
    e.preventDefault();
    const d = toData(p);
    zoomBy(e.deltaY < 0 ? 0.8 : 1.25, d.x, d.y);
  }, {passive:false});

  svg.addEventListener('pointerdown', e => {
    if(e.button !== 0 || e.pointerType === 'touch') return;   // 터치는 페이지 스크롤 우선, 버튼으로 확대
    const p = svgPt(e); if(!inPlotPt(p)) return;
    drag = {x: p.x, y: p.y, mode: e.shiftKey ? 'pan' : 'zoom', moved: false, id: e.pointerId, start: {...dom}, band: null};
  });
  svg.addEventListener('pointermove', e => {
    if(!drag) return;
    const p = svgPt(e);
    if(!drag.moved){
      if(Math.hypot(p.x - drag.x, p.y - drag.y) < 5) return;
      drag.moved = true;
      try{ svg.setPointerCapture(drag.id); }catch(_){}
      hover = null; apply();
      if(drag.mode === 'pan') svg.classList.add('panning');
    }
    if(drag.mode === 'pan'){
      const dx = (p.x - drag.x) / ctx.plotW * (drag.start.x1 - drag.start.x0);
      const dy = (p.y - drag.y) / ctx.plotH * (drag.start.y1 - drag.start.y0);
      dom = {x0: drag.start.x0 - dx, x1: drag.start.x1 - dx, y0: drag.start.y0 + dy, y1: drag.start.y1 + dy};
      draw();
    } else {
      const {M, plotW, plotH} = ctx;
      const cl = (v, a, b) => Math.max(a, Math.min(b, v));
      const ax = cl(Math.min(drag.x, p.x), M.left, M.left + plotW), bx = cl(Math.max(drag.x, p.x), M.left, M.left + plotW);
      const ay = cl(Math.min(drag.y, p.y), M.top, M.top + plotH), by = cl(Math.max(drag.y, p.y), M.top, M.top + plotH);
      if(!drag.band){
        drag.band = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        drag.band.setAttribute('class', 'zoombox');
        svg.appendChild(drag.band);
      }
      drag.band.setAttribute('x', ax); drag.band.setAttribute('y', ay);
      drag.band.setAttribute('width', bx - ax); drag.band.setAttribute('height', by - ay);
      drag.rect = {ax, bx, ay, by};
    }
  });
  const endDrag = e => {
    if(!drag) return;
    const d = drag; drag = null;
    svg.classList.remove('panning');
    if(d.band) d.band.remove();
    try{ svg.releasePointerCapture(d.id); }catch(_){}
    if(!d.moved) return;
    justDragged = true; setTimeout(() => { justDragged = false; }, 0);
    if(d.mode === 'zoom' && d.rect && d.rect.bx - d.rect.ax > 10 && d.rect.by - d.rect.ay > 10){
      const a = toData({x: d.rect.ax, y: d.rect.by}), b = toData({x: d.rect.bx, y: d.rect.ay});
      if(b.x - a.x >= MIN_RANGE && b.y - a.y >= MIN_RANGE){ dom = {x0: a.x, x1: b.x, y0: a.y, y1: b.y}; draw(); }
    }
  };
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  /* --- 화면 폭에 맞춰 다시 그리기 --- */
  let lastW = 0;
  size(); draw(); lastW = host.clientWidth;
  if('ResizeObserver' in window){
    new ResizeObserver(() => {
      const w = Math.round(host.clientWidth);
      if(Math.abs(w - lastW) < 2) return;
      lastW = w; size(); draw();
    }).observe(host);
  }
  return {select: t => { pin = t; hover = null; apply(); }, zoom: (a, b, c, d) => { dom = {x0: a, x1: b, y0: c, y1: d}; draw(); }, reset: () => { dom = {...FULL}; draw(); }};
}

return {makeBoard};
})();

function renderChartPC() {
  const list = D.items.map(i => i.h ? {t: i.t, n: i.n, s: i.g, h: i.h} : {t: i.t, n: i.n, s: i.g, h: null, x1m: i.x1m});
  $('main').innerHTML = `<section class="pcpanel pcchart"><div class="chart-body">
    <div id="pc-chart"></div>
    <div class="chart-side"><div class="chart-legend" id="pc-legend"></div><div class="pick" id="pc-pick" aria-live="polite"></div>
      <p class="chart-hint"><b>드래그</b> 영역 확대<br><b>Shift+드래그</b> 이동<br><b>Ctrl+휠</b> 확대·축소<br><b>더블클릭</b> 또는 초기화 버튼: 전체 보기</p>
      <p class="chart-caption">우상단 = 상승 지속, 좌상단 = 하락 전환, 우하단 = 상승 전환, 좌하단 = 하락 지속.<br>x = 1개월, y = 3개월 수익률</p></div></div></section>`;
  PCChart.makeBoard({list, chartId: 'pc-chart', pickId: 'pc-pick', legendId: 'pc-legend'});
}

/* ---------- 차트 ---------- */
function smooth(pts) {
  if (pts.length < 3) return 'M' + pts.map(p => p.join(',')).join('L');
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += `C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
  }
  return d;
}

function quadSVG(items, opt) {
  const W = opt.w, H = opt.h, m = {l: 34, r: 10, t: 10, b: 22};
  const plot = items.filter(i => i.h);
  const pts = [];
  plot.forEach(i => { pts.push([i.x1, i.x3]); if (opt.trails || i.sig) i.h.forEach(p => pts.push(p)); });
  let xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const ext = (a, mn) => { const lo = Math.min(...a, -mn), hi = Math.max(...a, mn), pad = (hi - lo) * .08; return [lo - pad, hi + pad]; };
  const [x0, x1] = ext(xs, 2), [y0, y1] = ext(ys, 2);
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const step = (lo, hi) => { const r = (hi - lo) / 5, p = Math.pow(10, Math.floor(Math.log10(r))); return [1, 2, 5, 10].map(k => k * p).find(s => s >= r); };
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="1개월·3개월 수익률 사분면">`;
  const tick = (lo, hi, f, vertical) => {
    const st = step(lo, hi);
    for (let v = Math.ceil(lo / st) * st; v <= hi; v += st) {
      const lab = (Math.abs(v) < 1e-9 ? '0' : (v > 0 ? '+' : '') + +v.toFixed(1)) + '%';
      if (vertical) s += `<line x1="${f(v)}" y1="${m.t}" x2="${f(v)}" y2="${H - m.b}" stroke="var(--line)"/><text x="${f(v)}" y="${H - 7}" font-size="9.5" fill="var(--text-3)" text-anchor="middle">${lab}</text>`;
      else s += `<line x1="${m.l}" y1="${f(v)}" x2="${W - m.r}" y2="${f(v)}" stroke="var(--line)"/><text x="${m.l - 4}" y="${f(v) + 3}" font-size="9.5" fill="var(--text-3)" text-anchor="end">${lab}</text>`;
    }
  };
  tick(x0, x1, X, true); tick(y0, y1, Y, false);
  s += `<line x1="${X(0)}" y1="${m.t}" x2="${X(0)}" y2="${H - m.b}" stroke="var(--text-3)" stroke-width="1.2"/><line x1="${m.l}" y1="${Y(0)}" x2="${W - m.r}" y2="${Y(0)}" stroke="var(--text-3)" stroke-width="1.2"/>`;
  const qlab = [['tr', W - m.r - 4, m.t + 14, 'end'], ['tl', m.l + 4, m.t + 14, 'start'], ['br', W - m.r - 4, H - m.b - 6, 'end'], ['bl', m.l + 4, H - m.b - 6, 'start']];
  qlab.forEach(([q, x, y, a]) => s += `<text x="${x}" y="${y}" font-size="11" font-weight="700" fill="var(--${q})" text-anchor="${a}" opacity=".85">${QN[q]}</text>`);
  // 신호 종목(또는 선택 종목)의 3주 궤적
  plot.filter(i => i.sig || i.t === opt.focus).forEach(i => {
    const tp = i.h.map(p => [X(p[0]), Y(p[1])]);
    s += `<path d="${smooth(tp)}" fill="none" stroke="var(--trail)" stroke-width="2" opacity=".85" stroke-linecap="round"/>`;
    tp.slice(0, -1).forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--trail)" opacity=".8"/>`);
  });
  // 점 + 라벨(겹치지 않는 자리 선택)
  const boxes = [], hit = (b) => boxes.some(o => !(b.x2 < o.x1 || b.x1 > o.x2 || b.y2 < o.y1 || b.y1 > o.y2));
  const dim = i => opt.focus && i.t !== opt.focus ? .35 : 1;
  plot.forEach(i => boxes.push({x1: X(i.x1) - 7, x2: X(i.x1) + 7, y1: Y(i.x3) - 7, y2: Y(i.x3) + 7}));
  plot.forEach(i => {
    const cx = X(i.x1), cy = Y(i.x3), tw = i.t.length * 6.4 + 2;
    let dot;
    if (i.sig === 'up') dot = `<circle cx="${cx}" cy="${cy}" r="9" fill="none" stroke="var(--sig)" stroke-width="1.4" opacity=".6"/><circle cx="${cx}" cy="${cy}" r="5.2" fill="var(--sig)" stroke="var(--surface)" stroke-width="1.3"/>`;
    else if (i.sig === 'dn') dot = `<rect x="${cx - 5}" y="${cy - 5}" width="10" height="10" transform="rotate(45 ${cx} ${cy})" fill="var(--dn)" stroke="var(--surface)" stroke-width="1.3"/>`;
    else dot = `<circle cx="${cx}" cy="${cy}" r="4.4" fill="var(--${i.quad})" stroke="var(--surface)" stroke-width="1.2"/>`;
    const r = i.sig ? 12 : 8;
    const cand = [[r, -r + 3, 'start'], [r, r + 2, 'start'], [-r, -r + 3, 'end'], [-r, r + 2, 'end'], [0, -r - 3, 'middle'], [0, r + 8, 'middle'], [r + 8, 3, 'start'], [-r - 8, 3, 'end']];
    let pick = cand[0];
    for (const c of cand) {
      const bx = c[2] === 'start' ? cx + c[0] : c[2] === 'end' ? cx + c[0] - tw : cx - tw / 2;
      const b = {x1: bx, x2: bx + tw, y1: cy + c[1] - 9, y2: cy + c[1] + 2};
      if (b.x1 >= m.l && b.x2 <= W - m.r && b.y1 >= m.t && b.y2 <= H - m.b && !hit(b)) { pick = c; boxes.push(b); break; }
    }
    s += `<g class="pt" data-t="${i.t}" opacity="${dim(i)}">${dot}<circle cx="${cx}" cy="${cy}" r="15" fill="transparent"/>` +
      `<text x="${cx + pick[0]}" y="${cy + pick[1]}" font-size="10.5" font-weight="${i.sig ? 700 : 500}" fill="var(--text)" text-anchor="${pick[2]}">${i.t}</text></g>`;
  });
  return s + '</svg>';
}

/* ---------- 관심종목 편집 ---------- */
const REPO = 'jopyx2/watchlist-momentum';
let CFG = null, WL = null, wlMsg = null, wlBusy = false;

async function loadCfg() {
  if (CFG) return;
  try {
    const r = await fetch('config.json?_=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    CFG = await r.json();
  } catch (e) {
    if (typeof INLINE_CFG !== 'undefined') CFG = JSON.parse(JSON.stringify(INLINE_CFG));
  }
  if (CFG) WL = CFG.watchlist.map(w => ({ticker: w.ticker, name: w.name || w.ticker}));
}

const wlDirty = () => !!CFG && JSON.stringify(WL) !== JSON.stringify(CFG.watchlist.map(w => ({ticker: w.ticker, name: w.name || w.ticker})));
const getToken = () => { try { return localStorage.getItem('ghtoken') || ''; } catch (e) { return ''; } };

function wlStatus(t) {
  const it = D && D.items.find(i => i.t === t);
  if (it) return it.h ? ['ok', QN[it.quad]] : ['ok', '상장 3개월 미만'];
  const inCfg = CFG.watchlist.some(w => w.ticker === t);
  return inCfg ? ['warn', '시세 없음'] : ['wait', '저장 후 계산'];
}

async function renderWatch() {
  $('main').innerHTML = '<div class="empty">불러오는 중…</div>';
  await loadCfg();
  if (!CFG) { $('main').innerHTML = '<div class="empty">관심종목 설정을 불러오지 못했습니다.<br>연결을 확인한 뒤 새로고침하세요.</div>'; return; }
  const dirty = wlDirty(), tok = getToken();
  let html = `<section class="wl-add"><h2 class="grp" style="margin-top:4px"><i style="background:var(--text-3)"></i>종목 추가</h2>
    <form id="wl-form" class="wl-form" autocomplete="off">
      <input id="wl-t" placeholder="티커" maxlength="8" autocapitalize="characters" spellcheck="false" aria-label="티커 (예: MSFT)">
      <input id="wl-n" placeholder="이름 (선택)" maxlength="20" aria-label="이름 (예: 마이크로소프트)">
      <button type="submit">추가</button></form>
    <div class="wl-hint" id="wl-hint">미국 종목 티커만 입력하세요 (예: MSFT, BRK.B). 존재하지 않는 티커는 저장 뒤 "시세 없음"으로 표시됩니다.</div></section>`;
  html += `<h2 class="grp"><i style="background:var(--text-3)"></i>현재 관심종목 <span>${WL.length}</span></h2><div class="rows">` +
    (WL.length ? WL.map(w => {
      const [k, label] = wlStatus(w.ticker);
      return `<div class="wl-row"><div class="id"><span class="tk">${w.ticker}</span><span class="nm">${w.name}</span><div class="st wl-${k}">${label}</div></div>
        <button class="wl-del" data-del="${w.ticker}" aria-label="${w.ticker} 삭제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
    }).join('') : '<div class="empty">관심종목이 없습니다. 위에서 티커를 추가하세요.</div>') + `</div>`;
  html += `<details class="wl-conn"${tok ? '' : ' open'}><summary>${tok ? 'GitHub 연결됨' : 'GitHub 연결 필요'}</summary>
    <p>저장하려면 이 폰에서 GitHub에 쓸 수 있는 토큰이 한 번 필요합니다. 이 저장소(${REPO}) 하나에만 <b>Contents</b>와 <b>Actions</b> 쓰기 권한을 준 토큰을 만들어 붙여넣으세요. 토큰은 이 폰의 브라우저에만 저장됩니다.</p>
    <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 만드는 곳 열기</a>
    <div class="wl-form" style="margin-top:10px"><input id="wl-tok" type="password" placeholder="${tok ? '저장된 토큰이 있습니다' : '토큰 붙여넣기'}" autocomplete="off" aria-label="GitHub 토큰">
      <button type="button" id="wl-toksave">${tok ? '바꾸기' : '저장'}</button></div>${tok ? '<button type="button" class="wl-link" id="wl-tokdel">토큰 지우기</button>' : ''}</details>`;
  if (wlMsg) html += `<div class="wl-msg ${wlMsg[0]}" role="status">${wlMsg[1]}</div>`;
  if (dirty) html += `<div class="wl-bar"><span>변경 ${wlChanges()}건</span><button type="button" id="wl-undo">되돌리기</button><button type="button" id="wl-save" ${wlBusy ? 'disabled' : ''}>${wlBusy ? '저장 중…' : '저장하고 반영'}</button></div>`;
  $('main').innerHTML = html;
  wireWatch();
}

function wlChanges() {
  const a = new Set(CFG.watchlist.map(w => w.ticker)), b = new Set(WL.map(w => w.ticker));
  let n = 0; a.forEach(t => { if (!b.has(t)) n++; }); b.forEach(t => { if (!a.has(t)) n++; });
  const names = new Map(CFG.watchlist.map(w => [w.ticker, w.name || w.ticker]));
  WL.forEach(w => { if (names.has(w.ticker) && names.get(w.ticker) !== w.name) n++; });
  return n;
}

function wireWatch() {
  $('wl-form').onsubmit = e => {
    e.preventDefault();
    const t = $('wl-t').value.trim().toUpperCase(), n = $('wl-n').value.trim() || t;
    if (!/^[A-Z]{1,5}([.-][A-Z])?$/.test(t)) { $('wl-hint').textContent = '티커 형식이 맞지 않습니다. 영문 1~5자(예: MSFT, BRK.B)로 입력하세요.'; $('wl-hint').className = 'wl-hint bad'; return; }
    if (WL.some(w => w.ticker === t)) { $('wl-hint').textContent = `${t}는 이미 관심종목에 있습니다.`; $('wl-hint').className = 'wl-hint bad'; return; }
    WL.push({ticker: t, name: n}); wlMsg = null; renderWatch();
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { WL = WL.filter(w => w.ticker !== b.dataset.del); wlMsg = null; renderWatch(); });
  if ($('wl-undo')) $('wl-undo').onclick = () => { WL = CFG.watchlist.map(w => ({ticker: w.ticker, name: w.name || w.ticker})); wlMsg = null; renderWatch(); };
  if ($('wl-save')) $('wl-save').onclick = pushWatchlist;
  $('wl-toksave').onclick = () => { const v = $('wl-tok').value.trim(); if (!v) return; try { localStorage.setItem('ghtoken', v); } catch (e) {} wlMsg = ['ok', '토큰을 저장했습니다.']; renderWatch(); };
  if ($('wl-tokdel')) $('wl-tokdel').onclick = () => { try { localStorage.removeItem('ghtoken'); } catch (e) {} wlMsg = ['ok', '토큰을 지웠습니다.']; renderWatch(); };
}

/* config.json 을 원래 모양(종목 한 줄씩)으로 다시 쓴다 */
function serializeCfg(cfg) {
  const lines = Object.keys(cfg).map(k => {
    if (k !== 'watchlist') return `  ${JSON.stringify(k)}: ${JSON.stringify(cfg[k])}`;
    const rows = cfg.watchlist.map(w => `    {"ticker": ${JSON.stringify(w.ticker)}, "name": ${JSON.stringify(w.name)}}`);
    return `  "watchlist": [\n${rows.join(',\n')}\n  ]`;
  });
  return `{\n${lines.join(',\n')}\n}\n`;
}
const b64enc = s => { const u = new TextEncoder().encode(s); let b = ''; u.forEach(c => b += String.fromCharCode(c)); return btoa(b); };
const b64dec = s => { const b = atob(s.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))); };

async function pushWatchlist() {
  const tok = getToken();
  if (!tok) { wlMsg = ['bad', '먼저 아래 "GitHub 연결"에 토큰을 저장하세요.']; renderWatch(); return; }
  wlBusy = true; renderWatch();
  const api = `https://api.github.com/repos/${REPO}`;
  const H = {Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'};
  try {
    const cur = await fetch(`${api}/contents/config.json?ref=main`, {headers: H});
    if (cur.status === 401 || cur.status === 403 || cur.status === 404) throw new Error('토큰이 없거나 권한이 부족합니다. 이 저장소의 Contents·Actions 쓰기 권한을 확인하세요.');
    if (!cur.ok) throw new Error('설정 파일을 읽지 못했습니다 (' + cur.status + ').');
    const curJ = await cur.json();
    const cfg = JSON.parse(b64dec(curJ.content));
    cfg.watchlist = WL.map(w => ({ticker: w.ticker, name: w.name}));
    const put = await fetch(`${api}/contents/config.json`, {method: 'PUT', headers: H,
      body: JSON.stringify({message: `관심종목 변경 ${WL.length}개 (앱)`, content: b64enc(serializeCfg(cfg)), sha: curJ.sha, branch: 'main'})});
    if (!put.ok) throw new Error('저장하지 못했습니다 (' + put.status + '). 토큰의 Contents 쓰기 권한을 확인하세요.');
    CFG = cfg;
    const run = await fetch(`${api}/actions/workflows/update.yml/dispatches`, {method: 'POST', headers: H, body: JSON.stringify({ref: 'main'})});
    wlMsg = run.ok ? ['ok', typeof INLINE !== 'undefined' ? '저장했습니다. 폰 앱에는 2~3분 뒤 반영됩니다. 이 PC 화면은 바탕화면 아이콘으로 다시 실행하면 새 종목이 계산됩니다.' : '저장했습니다. 새 종목의 계산에 2~3분 걸립니다. 잠시 뒤 새로고침하세요.']
                   : ['bad', '목록은 저장했지만 계산을 시작하지 못했습니다. 토큰에 Actions 쓰기 권한이 있어야 합니다. 다음 평일 아침 자동 갱신 때 반영됩니다.'];
  } catch (e) {
    wlMsg = ['bad', e.message || '저장하지 못했습니다. 네트워크를 확인하세요.'];
  }
  wlBusy = false; renderWatch();
}

  <div class="read"><h3>② 속도 변화 — 요즘 속도가 평소보다 빠른가</h3>
    <p><b>속도 변화 = 1M − 3M÷3</b> (%p)<br>최근 1개월을 '3개월 평균 한 달치'와 비교한 값입니다. ＋면 요즘이 평소보다 빠르고, －면 느립니다.</p>
    <ul><li>↗ +${b}%p 이상 : 상승 가속 · 낙폭 둔화</li><li>→ ±${b}%p 이내 : 상승 유지 · 하락 유지</li><li>↘ −${b}%p 이하 : 상승 둔화 · 낙폭 확대</li></ul></div>
  <div class="read"><h3>③ 신호 — 방향이 바뀐 종목</h3>
    <ul><li><b style="color:var(--sig)">▲ 상승 진입</b> : 최근 3주 안에 상승 전환 구간을 거쳐 지금 상승 지속</li>
    <li><b style="color:var(--dn)">▼ 하락 진입</b> : 최근 3주 안에 하락 전환 구간을 거쳐 지금 하락 지속</li>
    <li>🔻 <b>반등 꺾임 · 상승 꺾임</b> : 지난주 상승 쪽이었다가 이번 주 하락 지속으로 내려옴. 방향이 나빠진 종목이라 속도 변화보다 이 표시를 우선해서 봅니다.</li></ul>
    <p>목록의 '조정→하락' 같은 표기는 (지난주 → 이번 주) 사분면 이동입니다. 상승 = 상승 지속, 반등 = 상승 전환, 조정 = 하락 전환, 하락 = 하락 지속.</p></div>`;
}

/* ---------- 화면 전환 ---------- */
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelector('.wrap').classList.toggle('wide', tab === 'chart');
  if (!D) return;
  (tab === 'chart' ? renderChart : tab === 'guide' ? renderGuide : tab === 'watch' ? renderWatch : renderList)();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; save('tab', tab); closeSheet(); window.scrollTo(0, 0); render(); });
$('refresh').onclick = load;
window.matchMedia('(min-width: 900px)').addEventListener('change', () => { if (D && tab === 'chart') render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D) load(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
load();
</script>
